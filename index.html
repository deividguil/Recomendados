<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomendados a bordo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recomendados">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="Sortable.min.js"></script>
<style>
:root{
  --bg:#eef0f3; --card:#ffffff; --ink:#14213a; --muted:#5d6779; --line:#d6dbe3;
  --accent:#c8102e; --accent-soft:#fbe7ea; --ok:#1f7a4d; --ok-soft:#e3f3ea; --amber:#9a5b00; --amber-soft:#fdf0d9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1420; --card:#172033; --ink:#e7ebf2; --muted:#9aa4b6; --line:#2a3550;
  --accent:#ff5468; --accent-soft:#3a1c25; --ok:#5fd19a; --ok-soft:#173527; --amber:#f2b552; --amber-soft:#3a2c14; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:12px 8px;font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;display:flex;gap:8px;justify-content:center;align-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .n{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;flex:1}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel h2{grid-column:1/-1;margin:0;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:0}
.field{display:flex;gap:6px}
input,textarea{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.mic{flex:none;width:42px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;display:grid;place-items:center}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{grid-column:1/-1;font-size:13px;color:var(--amber);margin:0}
.flight{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px 14px;padding:12px 16px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.fcode{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:.02em}
.froute{border:0;background:none;padding:0;font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1;letter-spacing:.03em;color:var(--muted)}
.froute.add{font-family:var(--f-body);font-size:12px;font-weight:600;text-decoration:underline;letter-spacing:0}
.frinput{width:110px;font-size:16px;padding:4px 8px;text-transform:uppercase}
.ftime{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.flight.ajeno{border:2px solid var(--accent)}
.ajenoTag{background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;padding:5px 16px}
.cmte{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 16px;background:var(--accent-soft);border-bottom:1px dashed var(--line)}
.cmte .who{flex:1 1 160px}
.cmte .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.cmte .nm{font-weight:600;overflow-wrap:anywhere}
.cmte .tl{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.cmte .acts{display:flex;gap:8px}
.cmte a{text-decoration:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.cmte .wa{background:#1f9d55;color:#fff}
.cmte .call{border:1px solid var(--line);background:var(--card);color:var(--ink)}
.fbar{display:flex;justify-content:flex-end;gap:16px;padding:8px 16px;border-bottom:1px dashed var(--line)}
.fcol{display:flex;flex-direction:column;gap:3px}
.cd{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.02em}
.cd small{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
.cd.soon{color:var(--accent);font-weight:600}
.cd.gone{color:var(--muted)}
.nopax{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;color:var(--muted);font-size:14px}
.nopax .btn{padding:8px 12px;font-size:14px}
#list{display:flex;flex-direction:column;gap:12px}
.count.zero{background:var(--bg);color:var(--muted)}
.fdate{font-size:13px;font-weight:600;text-transform:capitalize}
.count{margin-left:auto;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.count.done{background:var(--ok-soft);color:var(--ok)}
.count.sb{background:var(--amber-soft);color:var(--amber)}
.share{display:flex;gap:8px;width:100%}
.share a,.share button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
.share .ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pax{list-style:none;margin:0;padding:0}
.pax li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
.pax li:first-child{border-top:0}
.seat{font-family:var(--f-mono);font-size:15px;min-width:44px;text-align:center;padding:6px 4px;border:1.5px solid var(--ink);border-radius:6px}
.seat.none{border-style:dashed;color:var(--muted);border-color:var(--line)}
.prio{display:flex;align-items:center;gap:6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;padding:4px 0}
.grip{color:var(--muted);font-size:18px;line-height:1;letter-spacing:-2px}
.num{font-family:var(--f-display);font-weight:700;font-size:26px;min-width:28px;text-align:center;color:var(--amber)}
.who{min-width:0}
.name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.from{font-size:13px;color:var(--muted)}
.note{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline}
.link.danger{color:var(--accent)}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;display:grid;place-items:center;font-size:18px;font-weight:700}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
li.attended .name{text-decoration:line-through;text-decoration-color:var(--muted)}
li.attended{opacity:.7}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;text-transform:uppercase;margin-bottom:4px}
footer{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding-top:8px}
@media (max-width:420px){.panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Recomendados <span>a bordo</span></h1>
      <div class="sub">Pasajeros que te han encargado, vuelo a vuelo.</div>
    </div>
    <div style="display:flex;gap:8px"><button class="btn ghost" id="btnNewFlight" type="button">+ Vuelo</button><button class="btn" id="btnNew" type="button">+ Añadir</button></div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tCuidar" aria-selected="true">A cuidar <span class="n" id="nCuidar">0</span></button>
    <button type="button" role="tab" id="tTrans" aria-selected="false">Transportines <span class="n" id="nTrans">0</span></button>
  </div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filtro">
      <button type="button" id="fUp" aria-pressed="true">Próximos</button>
      <button type="button" id="fAll" aria-pressed="false">Todos</button>
    </div>
    <span class="hint" id="hint">Arrastra desde ⋮⋮ para cambiar el orden</span>
  </div>

  <form class="panel" id="form" hidden>
    <h2 id="formTitle">Nuevo recomendado</h2>
    <div class="seg full" role="group" aria-label="Tipo">
      <button type="button" id="kCuidar" aria-pressed="true">Tiene plaza · cuidar</button>
      <button type="button" id="kTrans" aria-pressed="false">Stand-by · transportín</button>
    </div>
    <label>Vuelo<input id="iVuelo" placeholder="IB 0281" autocomplete="off"></label>
    <label>Fecha<input id="iFecha" type="date"></label>
    <label class="full">Trayecto<input id="iTrayecto" placeholder="MAD-NRT" autocomplete="off" autocapitalize="characters"></label>
    <label class="full">Nombre del pasajero<span class="field"><input id="iNombre" placeholder="Nombre y apellidos" autocomplete="off"><button type="button" class="mic" data-for="iNombre" aria-label="Dictar nombre"></button></span></label>
    <label>Asiento<span class="field"><input id="iAsiento" placeholder="Vacío si no lo sabes" autocomplete="off"><button type="button" class="mic" data-for="iAsiento" aria-label="Dictar asiento"></button></span></label>
    <label>De parte de<span class="field"><input id="iDeParte" placeholder="Quién te lo pide" autocomplete="off"><button type="button" class="mic" data-for="iDeParte" aria-label="Dictar de parte de quién"></button></span></label>
    <label class="full">Nota<span class="field"><textarea id="iNota" placeholder="Primer vuelo, cumpleaños, va en business…"></textarea><button type="button" class="mic" data-for="iNota" aria-label="Dictar nota"></button></span></label>
    <p class="msg" id="formMsg"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnCancel">Cancelar</button>
      <button type="submit" class="btn" id="btnSave">Guardar</button>
    </div>
  </form>

  <form class="panel" id="flightForm" hidden>
    <h2 id="ffTitle">Nuevo vuelo</h2>
    <div class="seg full" role="group" aria-label="¿Es tu vuelo?">
      <button type="button" id="kMine" aria-pressed="false">Mi vuelo</button>
      <button type="button" id="kOther" aria-pressed="true">No es mi vuelo</button>
    </div>
    <label>Vuelo<input id="fVuelo" placeholder="IB 3166" autocomplete="off"></label>
    <label>Fecha<input id="fFecha" type="date"></label>
    <label>Trayecto<input id="fTrayecto" placeholder="MAD-BCN" autocomplete="off" autocapitalize="characters"></label>
    <label>Hora de salida (España)<input id="fHora" type="time"></label>
    <div class="full" id="cmteFields" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <label>Comandante<span class="field"><input id="fCmte" placeholder="Nombre del comandante" autocomplete="off"><button type="button" class="mic" data-for="fCmte" aria-label="Dictar comandante"></button></span></label>
      <label>Teléfono<input id="fTel" type="tel" inputmode="tel" placeholder="600 123 456" autocomplete="off"></label>
    </div>
    <p class="msg" id="ffMsg"></p>
    <div class="actions">
      <button type="button" class="link danger" id="btnFfDel" hidden>Quitar vuelo</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="btnFfCancel">Cancelar</button>
      <button type="submit" class="btn" id="btnFfSave">Guardar vuelo</button>
    </div>
  </form>

  <div class="panel" id="importPanel" hidden>
    <h2>Importar lista</h2>
    <p class="full sub" style="margin:0">Pega aquí el bloque que te prepara Claude en el chat. Si alguien ya existe, se actualiza; no se duplica.</p>
    <textarea class="full" id="iImport" style="min-height:140px" placeholder='[{"vuelo":"IB 0281", ...}]'></textarea>
    <p class="msg" id="importMsg"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnImportCancel">Cerrar</button>
      <button type="button" class="btn" id="btnImportGo">Importar</button>
    </div>
  </div>

  <p class="msg" id="csvMsg" hidden></p>
  <div id="list"></div>

  <footer>
    <button type="button" class="link" id="btnCsv">Importar programación (CSV)</button>
    <input type="file" id="iCsv" accept=".csv,text/csv,text/plain" hidden>
    <button type="button" class="link" id="btnImport">Importar lista</button>
    <button type="button" class="link" id="btnExport">Copia de seguridad</button>
  </footer>
</div>

<script>
const KEY="recomendados.v1";
const SEED=[];
const KEYV="recomendados.vuelos.v1";
let flights=[];
const $=id=>document.getElementById(id);
let rows=[], filter="up", tab="cuidar", kind="cuidar", editing=null, pendingDelete=null, sortables=[];

function load(){try{const s=localStorage.getItem(KEY);rows=s?JSON.parse(s):SEED.slice();if(!s)save()}catch(e){rows=SEED.slice()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}
function loadV(){try{flights=JSON.parse(localStorage.getItem(KEYV)||"[]")}catch(e){flights=[]}}
function saveV(){try{localStorage.setItem(KEYV,JSON.stringify(flights))}catch(e){}}
const fkey=(fecha,vuelo)=>fecha+"|"+fv(vuelo);
const getFlight=(fecha,vuelo)=>flights.find(f=>f.id===fkey(fecha,vuelo));
function upsertFlight(fecha,vuelo,patch){
  let f=getFlight(fecha,vuelo);
  if(!f){f={id:fkey(fecha,vuelo),fecha,vuelo:fv(vuelo),trayecto:""};flights.push(f)}
  Object.assign(f,patch);saveV();return f;
}
const fmtRoute=v=>norm(v).replace(/\s*[-–>\/]+\s*|\s+/g,"–");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const upd=(id,patch)=>{const r=rows.find(x=>x.id===id);if(r){Object.assign(r,patch);save();render()}};
const del=id=>{rows=rows.filter(x=>x.id!==id);save();render()};

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{try{return new Date(s+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}catch(e){return s}};
const norm=v=>(v||"").toUpperCase().replace(/\s+/g," ").trim();
/* IB281, ib 281, IB0281 -> "IB 0281" */
const fv=v=>{const c=(v||"").toUpperCase().replace(/\s+/g,"");const m=c.match(/^([A-Z]{2}|[A-Z]\d|\d[A-Z])(\d{1,4})([A-Z]?)$/);return m?m[1]+" "+m[2].padStart(4,"0")+m[3]:norm(v)};
const tipoOf=r=>r.tipo==="transportin"?"transportin":"cuidar";
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};

function flightText(fecha,vuelo){
  const same=rows.filter(r=>r.fecha===fecha&&fv(r.vuelo)===vuelo);
  const cu=same.filter(r=>tipoOf(r)==="cuidar").sort(byOrden);
  const tr=same.filter(r=>tipoOf(r)==="transportin").sort(byOrden);
  const line=r=>{let s=r.nombre;if(r.deParte)s+=" — de "+r.deParte;if(r.nota)s+=" ("+r.nota+")";return s};
  const fl=getFlight(fecha,vuelo);
  let t="✈️ "+vuelo+(fl&&fl.trayecto?" "+fmtRoute(fl.trayecto):"")+" · "+fmtDate(fecha)+" · Recomendados\n";
  if(cu.length){t+="\n🟢 A CUIDAR (con plaza):\n";cu.forEach((r,i)=>{t+=(i+1)+". "+line(r)+" — Asiento: "+(r.asiento?norm(r.asiento):"__")+"\n"})}
  if(tr.length){t+="\n🟡 TRANSPORTINES (stand-by), por este orden:\n";tr.forEach((r,i)=>{t+=(i+1)+". "+line(r)+(r.asiento?" — Asiento: "+norm(r.asiento):"")+"\n"})}
  if(cu.some(r=>!r.asiento))t+="\nCuando los tengas, ¿me pasas los asientos? Gracias 🙏";
  return t.trim();
}

function render(){
  sortables.forEach(s=>s.destroy());sortables=[];
  const t=today(), list=$("list"); list.textContent="";
  const upcoming=rows.filter(r=>filter==="all"||(r.fecha||"")>=t);
  $("nCuidar").textContent=upcoming.filter(r=>tipoOf(r)==="cuidar").length;
  $("nTrans").textContent=upcoming.filter(r=>tipoOf(r)==="transportin").length;
  $("hint").hidden=false;
  const shown=upcoming.filter(r=>tipoOf(r)===tab);
  const groups={};
  shown.forEach(r=>{const k=r.fecha+"|"+fv(r.vuelo);(groups[k]=groups[k]||[]).push(r)});
  flights.filter(f=>filter==="all"||(f.fecha||"")>=t).forEach(f=>{if(!groups[f.id])groups[f.id]=[]});
  if(!Object.keys(groups).length){
    const e=el("div","empty");e.append(el("strong",null,tab==="cuidar"?"Nadie a cuidar":"Sin transportines"));
    e.append((rows.length||flights.length)&&filter==="up"?"No hay nada en vuelos próximos. Mira en «Todos» o añade uno nuevo.":"Pulsa «+ Añadir», importa tu programación o la lista que te pase Claude.");
    list.append(e);return;
  }
  Object.keys(groups).sort((a,b)=>filter==="all"?b.localeCompare(a):a.localeCompare(b)).forEach(k=>{
    const [fecha,vuelo]=k.split("|"), g=groups[k];
    g.sort(byOrden);
    const done=g.filter(r=>r.atendido).length;
    const fl=getFlight(fecha,vuelo);
    const sec=el("section","flight"+(fl&&fl.ajeno?" ajeno":"")), h=el("div","fhead");
    if(fl&&fl.ajeno)sec.append(el("div","ajenoTag","No es mi vuelo"));
    const fc=el("div","fcol");fc.append(el("div","fcode",vuelo));
    const dep=depTime(fl);if(dep){const cd=el("div","cd");cd.dataset.t=dep;fc.append(cd);paintCd(cd)}
    h.append(fc,routeEl(fecha,vuelo,fl),el("div","fdate",fmtDate(fecha)));
    if(fl&&fl.salidaZ)h.append(el("span","ftime",fl.salidaZ+"Z"+(fl.avion?" · "+fl.avion:"")));
    else if(fl&&fl.hora)h.append(el("span","ftime","Sale "+fl.hora));
    if(!g.length)h.append(el("div","count zero","Sin recomendados"));

/* Hora de salida -> instante. Mis vuelos: hora Z del CSV. Ajenos: hora peninsular española. */
const madridDate=ms=>new Date(ms).toLocaleDateString("sv-SE",{timeZone:"Europe/Madrid"});
function madridOffset(ms){const p={};new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Madrid",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(ms).forEach(x=>p[x.type]=x.value);
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)-Math.floor(ms/60000)*60000}
function depTime(fl){
  if(!fl||!fl.fecha)return null;
  const [y,m,d]=fl.fecha.split("-").map(Number);
  if(fl.salidaZ){const [hh,mm]=fl.salidaZ.split(":").map(Number);let t=Date.UTC(y,m-1,d,hh,mm);
    if(madridDate(t)!==fl.fecha)t-=86400000; return t}
  if(fl.hora){const [hh,mm]=fl.hora.split(":").map(Number);const g=Date.UTC(y,m-1,d,hh,mm);let t=g-madridOffset(g);t=g-madridOffset(t);return t}
  return null;
}
function paintCd(c){
  const ms=+c.dataset.t-Date.now();
  if(ms<=0){c.className="cd gone";c.textContent=ms>-20*3600000?"Ya ha salido":"Volado";return}
  const m=Math.floor(ms/60000), dd=Math.floor(m/1440), hh=Math.floor(m%1440/60), mi=m%60;
  c.className="cd"+(ms<86400000?" soon":"");
  c.textContent=String(dd).padStart(2,"0")+","+String(hh).padStart(2,"0")+":"+String(mi).padStart(2,"0");
  const sm=el("small",null,"para salir");c.append(sm);
  c.setAttribute("aria-label",dd+" días, "+hh+" horas y "+mi+" minutos para la salida");
}

function parseCSV(t){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);out.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);out.push(row)}
  return out;
}
function importSchedule(text){
  const data=parseCSV(text.replace(/^\uFEFF/,""));if(!data.length)return null;
  const head=data[0].map(h=>h.trim().toLowerCase());
  const iS=Math.max(0,head.findIndex(h=>h==="asunto"||h==="subject"));
  let iD=head.findIndex(h=>h==="fecha de comienzo"||h==="start date");if(iD<0)iD=1;
  const re=/^\s*([A-Z0-9]{2})\s*(\d{1,4})[A-Z]?\s+([A-Z]{3})(\d{4})\s*-\s*([A-Z]{3})(\d{4})(?:\s*\/\s*([A-Z0-9]+))?/i;
  let nuevos=0,act=0;
  data.slice(1).forEach(r=>{
    const m=(r[iS]||"").match(re), d=(r[iD]||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m||!d)return;
    const fecha=d[3]+"-"+d[2].padStart(2,"0")+"-"+d[1].padStart(2,"0"), vuelo=fv(m[1]+m[2]);
    const patch={ajeno:false,trayecto:m[3].toUpperCase()+"–"+m[5].toUpperCase(),salidaZ:m[4].slice(0,2)+":"+m[4].slice(2),llegadaZ:m[6].slice(0,2)+":"+m[6].slice(2),avion:m[7]?m[7].toUpperCase():""};
    if(getFlight(fecha,vuelo))act++;else nuevos++;
    upsertFlight(fecha,vuelo,patch);
  });
  return {nuevos,act};
}

$("iCsv").onchange=async()=>{

    if(text.includes("\uFFFD"))text=new TextDecoder("windows-1252").decode(buf);
    const res=importSchedule(text);
    if(!res||!(res.nuevos+res.act))msg.textContent="No he encontrado vuelos en ese archivo. Tiene que ser el CSV de tu programación exportado para Outlook.";
    else msg.textContent="Programación importada: "+res.nuevos+" vuelos nuevos"+(res.act?", "+res.act+" actualizados":"")+".";
    setFilter("up");
  }catch(e){msg.textContent="No se pudo leer el archivo."}

};

function waPhone(t){let d=(t||"").replace(/[^\d+]/g,"");if(!d)return"";
  if(d.startsWith("+"))d=d.slice(1);else if(d.startsWith("00"))d=d.slice(2);else if(d.length===9)d="34"+d;
  return d.replace(/\D/g,"")}
function cmteText(fecha,vuelo){
  const fl=getFlight(fecha,vuelo)||{};
  const same=rows.filter(r=>r.fecha===fecha&&fv(r.vuelo)===vuelo);
  const cu=same.filter(r=>tipoOf(r)==="cuidar").sort(byOrden), tr=same.filter(r=>tipoOf(r)==="transportin").sort(byOrden);
  const nom=(fl.cmte||"").trim().split(/\s+/)[0];
  let t="Hola"+(nom?" "+nom:"")+", ¿qué tal? Te escribo por tu vuelo "+vuelo+(fl.trayecto?" "+fmtRoute(fl.trayecto):"")+" del "+fmtDate(fecha)+(fl.hora?" a las "+fl.hora:"")+".";
  if(cu.length||tr.length){
    t+=" Te quería pedir un favor:\n";
    if(cu.length){t+="\nQue cuides a:\n";cu.forEach(r=>{t+="• "+r.nombre+(r.asiento?" ("+norm(r.asiento)+")":"")+(r.nota?" — "+r.nota:"")+"\n"})}
    if(tr.length){t+="\nSi fuera posible, transportín para:\n";tr.forEach((r,i)=>{t+=(tr.length>1?(i+1)+". ":"• ")+r.nombre+(r.nota?" — "+r.nota:"")+"\n"})}
    t+="\n¡Muchísimas gracias!";
  }
  return t;
}

$("tCuidar").onclick=()=>setTab("cuidar");$("tTrans").onclick=()=>setTab("transportin");
function setFilter(f){filter=f;$("fUp").setAttribute("aria-pressed",f==="up");$("fAll").setAttribute("aria-pressed",f==="all");render()}
$("fUp").onclick=()=>setFilter("up");$("fAll").onclick=()=>setFilter("all");

load(); loadV(); render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
