<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomendados a bordo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recomendados">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="Sortable.min.js"></script>
<style>
:root{
  --bg:#eef0f3; --card:#ffffff; --ink:#14213a; --muted:#5d6779; --line:#d6dbe3;
  --accent:#c8102e; --accent-soft:#fbe7ea; --ok:#1f7a4d; --ok-soft:#e3f3ea; --amber:#9a5b00; --amber-soft:#fdf0d9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1420; --card:#172033; --ink:#e7ebf2; --muted:#9aa4b6; --line:#2a3550;
  --accent:#ff5468; --accent-soft:#3a1c25; --ok:#5fd19a; --ok-soft:#173527; --amber:#f2b552; --amber-soft:#3a2c14; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:12px 8px;font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;display:flex;gap:8px;justify-content:center;align-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .n{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;flex:1}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel h2{grid-column:1/-1;margin:0;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:0}
.field{display:flex;gap:6px}
input,textarea{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.mic{flex:none;width:42px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;display:grid;place-items:center}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{grid-column:1/-1;font-size:13px;color:var(--amber);margin:0}
.flight{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px 14px;padding:12px 16px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.fcode{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:.02em}
.fdate{font-size:13px;font-weight:600;text-transform:capitalize}
.count{margin-left:auto;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.count.done{background:var(--ok-soft);color:var(--ok)}
.count.sb{background:var(--amber-soft);color:var(--amber)}
.share{display:flex;gap:8px;width:100%}
.share a,.share button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
.share .ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pax{list-style:none;margin:0;padding:0}
.pax li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
.pax li:first-child{border-top:0}
.seat{font-family:var(--f-mono);font-size:15px;min-width:44px;text-align:center;padding:6px 4px;border:1.5px solid var(--ink);border-radius:6px}
.seat.none{border-style:dashed;color:var(--muted);border-color:var(--line)}
.prio{display:flex;align-items:center;gap:6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;padding:4px 0}
.grip{color:var(--muted);font-size:18px;line-height:1;letter-spacing:-2px}
.num{font-family:var(--f-display);font-weight:700;font-size:26px;min-width:28px;text-align:center;color:var(--amber)}
.who{min-width:0}
.name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.from{font-size:13px;color:var(--muted)}
.note{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline}
.link.danger{color:var(--accent)}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;display:grid;place-items:center;font-size:18px;font-weight:700}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
li.attended .name{text-decoration:line-through;text-decoration-color:var(--muted)}
li.attended{opacity:.7}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;text-transform:uppercase;margin-bottom:4px}
footer{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding-top:8px}
@media (max-width:420px){.panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Recomendados <span>a bordo</span></h1>
      <div class="sub">Pasajeros que te han encargado, vuelo a vuelo.</div>
    </div>
    <button class="btn" id="btnNew" type="button">+ Añadir</button>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tCuidar" aria-selected="true">A cuidar <span class="n" id="nCuidar">0</span></button>
    <button type="button" role="tab" id="tTrans" aria-selected="false">Transportines <span class="n" id="nTrans">0</span></button>
  </div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filtro">
      <button type="button" id="fUp" aria-pressed="true">Próximos</button>
      <button type="button" id="fAll" aria-pressed="false">Todos</button>
    </div>
    <span class="hint" id="hint">Arrastra desde ⋮⋮ para cambiar el orden</span>
  </div>

  <form class="panel" id="form" hidden>
    <h2 id="formTitle">Nuevo recomendado</h2>
    <div class="seg full" role="group" aria-label="Tipo">
      <button type="button" id="kCuidar" aria-pressed="true">Tiene plaza · cuidar</button>
      <button type="button" id="kTrans" aria-pressed="false">Stand-by · transportín</button>
    </div>
    <label>Vuelo<input id="iVuelo" placeholder="IB 0281" autocomplete="off"></label>
    <label>Fecha<input id="iFecha" type="date"></label>
    <label class="full">Nombre del pasajero<span class="field"><input id="iNombre" placeholder="Nombre y apellidos" autocomplete="off"><button type="button" class="mic" data-for="iNombre" aria-label="Dictar nombre"></button></span></label>
    <label>Asiento<span class="field"><input id="iAsiento" placeholder="Vacío si no lo sabes" autocomplete="off"><button type="button" class="mic" data-for="iAsiento" aria-label="Dictar asiento"></button></span></label>
    <label>De parte de<span class="field"><input id="iDeParte" placeholder="Quién te lo pide" autocomplete="off"><button type="button" class="mic" data-for="iDeParte" aria-label="Dictar de parte de quién"></button></span></label>
    <label class="full">Nota<span class="field"><textarea id="iNota" placeholder="Primer vuelo, cumpleaños, va en business…"></textarea><button type="button" class="mic" data-for="iNota" aria-label="Dictar nota"></button></span></label>
    <p class="msg" id="formMsg"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnCancel">Cancelar</button>
      <button type="submit" class="btn" id="btnSave">Guardar</button>
    </div>
  </form>

  <div class="panel" id="importPanel" hidden>
    <h2>Importar lista</h2>
    <p class="full sub" style="margin:0">Pega aquí el bloque que te prepara Claude en el chat. Si alguien ya existe, se actualiza; no se duplica.</p>
    <textarea class="full" id="iImport" style="min-height:140px" placeholder='[{"vuelo":"IB 0281", ...}]'></textarea>
    <p class="msg" id="importMsg"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnImportCancel">Cerrar</button>
      <button type="button" class="btn" id="btnImportGo">Importar</button>
    </div>
  </div>

  <div id="list"></div>

  <footer>
    <button type="button" class="link" id="btnImport">Importar lista</button>
    <button type="button" class="link" id="btnExport">Copia de seguridad</button>
  </footer>
</div>

<script>
const KEY="recomendados.v1";
const SEED=[];
const $=id=>document.getElementById(id);
let rows=[], filter="up", tab="cuidar", kind="cuidar", editing=null, pendingDelete=null, sortables=[];

function load(){try{const s=localStorage.getItem(KEY);rows=s?JSON.parse(s):SEED.slice();if(!s)save()}catch(e){rows=SEED.slice()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const upd=(id,patch)=>{const r=rows.find(x=>x.id===id);if(r){Object.assign(r,patch);save();render()}};
const del=id=>{rows=rows.filter(x=>x.id!==id);save();render()};

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{try{return new Date(s+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}catch(e){return s}};
const norm=v=>(v||"").toUpperCase().replace(/\s+/g," ").trim();
const tipoOf=r=>r.tipo==="transportin"?"transportin":"cuidar";
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};

function flightText(fecha,vuelo){
  const same=rows.filter(r=>r.fecha===fecha&&norm(r.vuelo)===vuelo);
  const cu=same.filter(r=>tipoOf(r)==="cuidar").sort(byOrden);
  const tr=same.filter(r=>tipoOf(r)==="transportin").sort(byOrden);
  const line=r=>{let s=r.nombre;if(r.deParte)s+=" — de "+r.deParte;if(r.nota)s+=" ("+r.nota+")";return s};
  let t="✈️ "+vuelo+" · "+fmtDate(fecha)+" · Recomendados\n";
  if(cu.length){t+="\n🟢 A CUIDAR (con plaza):\n";cu.forEach((r,i)=>{t+=(i+1)+". "+line(r)+" — Asiento: "+(r.asiento?norm(r.asiento):"__")+"\n"})}
  if(tr.length){t+="\n🟡 TRANSPORTINES (stand-by), por este orden:\n";tr.forEach((r,i)=>{t+=(i+1)+". "+line(r)+(r.asiento?" — Asiento: "+norm(r.asiento):"")+"\n"})}
  if(cu.some(r=>!r.asiento))t+="\nCuando los tengas, ¿me pasas los asientos? Gracias 🙏";
  return t.trim();
}

function render(){
  sortables.forEach(s=>s.destroy());sortables=[];
  const t=today(), list=$("list"); list.textContent="";
  const upcoming=rows.filter(r=>filter==="all"||(r.fecha||"")>=t);
  $("nCuidar").textContent=upcoming.filter(r=>tipoOf(r)==="cuidar").length;
  $("nTrans").textContent=upcoming.filter(r=>tipoOf(r)==="transportin").length;
  $("hint").hidden=false;
  const shown=upcoming.filter(r=>tipoOf(r)===tab);
  if(!shown.length){
    const e=el("div","empty");e.append(el("strong",null,tab==="cuidar"?"Nadie a cuidar":"Sin transportines"));
    e.append(rows.length&&filter==="up"?"No hay nada en vuelos próximos. Mira en «Todos» o añade uno nuevo.":"Pulsa «+ Añadir» o importa la lista que te pase Claude.");
    list.append(e);return;
  }
  const groups={};
  shown.forEach(r=>{const k=r.fecha+"|"+norm(r.vuelo);(groups[k]=groups[k]||[]).push(r)});
  Object.keys(groups).sort((a,b)=>filter==="all"?b.localeCompare(a):a.localeCompare(b)).forEach(k=>{
    const [fecha,vuelo]=k.split("|"), g=groups[k];
    g.sort(byOrden);
    const done=g.filter(r=>r.atendido).length;
    const sec=el("section","flight"), h=el("div","fhead");
    h.append(el("div","fcode",vuelo),el("div","fdate",fmtDate(fecha)));
    h.append(tab==="cuidar"?el("div","count"+(done===g.length?" done":""),done+"/"+g.length+" atendidos"):el("div","count sb",g.length+" en stand-by · "+done+" a bordo"));
    const sh=el("div","share");
    const wa=el("a",null,"Enviar por WhatsApp");wa.href="https://wa.me/?text="+encodeURIComponent(flightText(fecha,vuelo));wa.target="_blank";wa.rel="noopener";
    const cp=el("button",null,"Copiar texto");cp.type="button";
    cp.onclick=()=>{const txt=flightText(fecha,vuelo);
      const ok=()=>{cp.textContent="Copiado ✓";cp.classList.add("ok");setTimeout(()=>{cp.textContent="Copiar texto";cp.classList.remove("ok")},2500)};
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,()=>alert(txt));else alert(txt)};
    sh.append(wa,cp);h.append(sh);
    sec.append(h);
    const ul=el("ul","pax");
    g.forEach((r,i)=>{
      const li=el("li",r.atendido?"attended":"");li.dataset.id=r.id;
      let lead;
      if(tab==="cuidar"){lead=el("div","prio");lead.setAttribute("aria-label","Posición "+(i+1)+", arrastra para mover");lead.append(el("span","grip","⋮⋮"),el("div","seat"+(r.asiento?"":" none"),r.asiento?norm(r.asiento):"—"))}
      else{lead=el("div","prio");lead.setAttribute("aria-label","Prioridad "+(i+1)+", arrastra para mover");lead.append(el("span","grip","⋮⋮"),el("span","num",String(i+1)))}
      const w=el("div","who");w.append(el("div","name",r.nombre));
      if(r.deParte)w.append(el("div","from","De parte de "+r.deParte));
      if(tab==="transportin"&&r.asiento)w.append(el("div","from","Asiento asignado: "+norm(r.asiento)));
      if(r.nota)w.append(el("div","note",r.nota));
      const ra=el("div","row-actions");
      const ed=el("button","link","Editar");ed.type="button";ed.onclick=()=>openForm(r);
      const mv=el("button","link",tab==="cuidar"?"Pasar a transportín":"Pasar a cuidar");mv.type="button";
      mv.onclick=()=>upd(r.id,tab==="cuidar"?{tipo:"transportin",orden:nextOrden(r.fecha,r.vuelo,"transportin")}:{tipo:"cuidar",orden:nextOrden(r.fecha,r.vuelo,"cuidar")});
      const dl=el("button","link danger",pendingDelete===r.id?"¿Seguro? Toca para borrar":"Borrar");dl.type="button";
      dl.onclick=()=>{if(pendingDelete===r.id){pendingDelete=null;del(r.id)}else{pendingDelete=r.id;render()}};
      ra.append(ed,mv,dl);w.append(ra);
      const ck=el("button","chk","✓");ck.type="button";
      ck.setAttribute("aria-pressed",r.atendido?"true":"false");
      ck.setAttribute("aria-label",(tab==="cuidar"?"Marcar atendido: ":"Marcar a bordo: ")+r.nombre);
      ck.onclick=()=>upd(r.id,{atendido:!r.atendido});
      li.append(lead,w,ck);ul.append(li);
    });
    sec.append(ul);list.append(sec);
    if(window.Sortable){
      sortables.push(Sortable.create(ul,{handle:".prio",animation:150,touchStartThreshold:4,
        onEnd:()=>{[...ul.children].forEach((li,idx)=>{const r=rows.find(x=>x.id===li.dataset.id);if(r)r.orden=idx+1});save();render()}}));
    }
  });
}

function nextOrden(fecha,vuelo,tipo){
  tipo=tipo||"transportin";
  return rows.filter(r=>tipoOf(r)===tipo&&r.fecha===fecha&&norm(r.vuelo)===norm(vuelo)).reduce((m,r)=>Math.max(m,r.orden||0),0)+1;
}
const byOrden=(a,b)=>(a.orden??1e9)-(b.orden??1e9)||(a.creado||0)-(b.creado||0);
function setKind(k){kind=k;$("kCuidar").setAttribute("aria-pressed",k==="cuidar");$("kTrans").setAttribute("aria-pressed",k==="transportin")}
$("kCuidar").onclick=()=>setKind("cuidar");$("kTrans").onclick=()=>setKind("transportin");

function openForm(r){
  editing=r?r.id:null; pendingDelete=null; $("importPanel").hidden=true;
  $("formTitle").textContent=r?"Editar recomendado":"Nuevo recomendado"; $("formMsg").textContent="";
  const next=rows.filter(x=>(x.fecha||"")>=today()).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
  $("iVuelo").value=r?r.vuelo:(next?next.vuelo:"");
  $("iFecha").value=r?r.fecha:(next?next.fecha:today());
  setKind(r?tipoOf(r):tab);
  $("iNombre").value=r?r.nombre:""; $("iAsiento").value=r?(r.asiento||""):"";
  $("iDeParte").value=r?(r.deParte||""):""; $("iNota").value=r?(r.nota||""):"";
  $("form").hidden=false; window.scrollTo({top:0,behavior:"smooth"});
}
$("btnNew").onclick=()=>openForm(null);
$("btnCancel").onclick=()=>{$("form").hidden=true;editing=null;stopMic()};

$("form").addEventListener("submit",e=>{
  e.preventDefault(); stopMic();
  const vuelo=norm($("iVuelo").value), fecha=$("iFecha").value, nombre=$("iNombre").value.trim();
  if(!vuelo||!fecha||!nombre){$("formMsg").textContent="Faltan el vuelo, la fecha o el nombre.";return}
  const data={tipo:kind,vuelo,fecha,nombre,asiento:norm($("iAsiento").value),deParte:$("iDeParte").value.trim(),nota:$("iNota").value.trim()};
  if(editing){
    const old=rows.find(r=>r.id===editing);
    if(tipoOf(old)!==kind||old.fecha!==fecha||norm(old.vuelo)!==vuelo)data.orden=nextOrden(fecha,vuelo,kind);
    Object.assign(old,data);
  } else {
    data.orden=nextOrden(fecha,vuelo,kind);
    rows.push({id:uid(),...data,atendido:false,creado:Date.now()});
  }
  save(); $("form").hidden=true; editing=null; setTab(kind);
});

/* Dictado: micro del navegador si está disponible; si no, se ocultan los botones y vale el micro del teclado */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
let rec=null, recBtn=null;
function stopMic(){if(rec){try{rec.stop()}catch(e){}}}
document.querySelectorAll(".mic").forEach(b=>{
  b.innerHTML=micSvg; if(!SR){b.hidden=true;return}
  b.onclick=()=>{
    if(rec&&recBtn===b){stopMic();return} stopMic();
    const input=$(b.dataset.for), base=input.value?input.value.trim()+" ":"";
    rec=new SR(); rec.lang="es-ES"; rec.interimResults=true; rec.continuous=b.dataset.for==="iNota";
    recBtn=b; b.classList.add("on");
    rec.onresult=ev=>{let s="";for(let i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;
      if(b.dataset.for==="iAsiento")s=s.replace(/\s+/g,"").toUpperCase();
      input.value=(b.dataset.for==="iAsiento"?"":base)+s.trim()};
    rec.onerror=ev=>{if(ev.error==="not-allowed")$("formMsg").textContent="Permite el micrófono para esta web en los ajustes del navegador."};
    rec.onend=()=>{b.classList.remove("on");rec=null;recBtn=null};
    try{rec.start()}catch(e){b.classList.remove("on")}
  };
});

/* Importar lista preparada por Claude y copia de seguridad */
$("btnImport").onclick=()=>{$("form").hidden=true;$("importPanel").hidden=false;$("importMsg").textContent="";$("iImport").value="";window.scrollTo({top:0,behavior:"smooth"})};
$("btnImportCancel").onclick=()=>{$("importPanel").hidden=true};
$("btnImportGo").onclick=()=>{
  let data;try{data=JSON.parse($("iImport").value.trim())}catch(e){$("importMsg").textContent="No es un bloque válido. Copia el bloque entero, desde [ hasta ].";return}
  if(!Array.isArray(data))data=[data];
  let n=0;
  data.forEach(p=>{if(!p||!p.nombre)return;
    const rec2={tipo:p.tipo==="transportin"?"transportin":"cuidar",vuelo:norm(p.vuelo),fecha:p.fecha||today(),nombre:String(p.nombre).trim(),
      asiento:norm(p.asiento),deParte:(p.deParte||"").trim(),nota:(p.nota||"").trim()};
    const ex=p.id&&rows.find(r=>r.id===p.id);
    if(ex){Object.assign(ex,rec2);if(p.orden!=null)ex.orden=p.orden;if(p.atendido!=null)ex.atendido=!!p.atendido}
    else{rec2.orden=p.orden??nextOrden(rec2.fecha,rec2.vuelo,rec2.tipo);rows.push({id:p.id||uid(),...rec2,atendido:!!p.atendido,creado:Date.now()+n})}
    n++});
  save();$("importMsg").textContent=n?("Importadas "+n+" personas."):"No había nadie con nombre en el bloque.";render();
};
$("btnExport").onclick=async()=>{
  const txt=JSON.stringify(rows,null,1), name="recomendados-"+today()+".json";
  try{const f=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Copia de recomendados"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;a.click();
};

function setTab(t){tab=t;$("tCuidar").setAttribute("aria-selected",t==="cuidar");$("tTrans").setAttribute("aria-selected",t==="transportin");pendingDelete=null;render()}
$("tCuidar").onclick=()=>setTab("cuidar");$("tTrans").onclick=()=>setTab("transportin");
function setFilter(f){filter=f;$("fUp").setAttribute("aria-pressed",f==="up");$("fAll").setAttribute("aria-pressed",f==="all");render()}
$("fUp").onclick=()=>setFilter("up");$("fAll").onclick=()=>setFilter("all");

load(); render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
